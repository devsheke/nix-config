# Rose Pine Glass — matches the Quickshell palette, font and panel geometry.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Clear the password buffer with Escape, Ctrl+U or Ctrl+Backspace.

$font = JetBrainsMono Nerd Font
$text = rgb(e0def4)
$muted = rgb(908caa)
$rose = rgb(ebbcba)
$love = rgb(eb6f92)
$gold = rgb(f6c177)

general {
    hide_cursor = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = linear, 0, 0, 1, 1
    animation = fadeIn, 1, 1.8, easeOut
    animation = fadeOut, 1, 1.8, easeOut
    animation = inputFieldColors, 1, 1.8, linear
    animation = inputFieldDots, 1, 1.8, easeOut
}

background {
    monitor =
    path = screenshot
    color = rgb(13111b)
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.0
}

# Same 90% surface opacity and 16 px corners as the shell popovers.
shape {
    monitor =
    size = 420, 420
    color = rgba(13111be6)
    rounding = 16
    border_size = 1
    border_color = rgba(524f6759)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000040)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = $rose
    font_size = 64
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %b %d %Y"
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 14
    font_family = $font
    position = 0, 5
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 348, 52
    outline_thickness = 1
    inner_color = rgba(26233ae6)
    outer_color = rgba(524f6759)
    check_color = $rose
    fail_color = $love
    capslock_color = $gold
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 16
    placeholder_text = Password
    check_text = Authenticating...
    fail_text = $PAMFAIL
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    position = 0, -50
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, -102
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $FPRINTFAIL
    color = $love
    font_size = 11
    font_family = $font
    position = 0, -128
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 11
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -166
    halign = center
    valign = center
    zindex = 1
}

# Laptop battery, read directly from sysfs every ten seconds.
label {
    monitor =
    text = cmd[update:10000] awk 'NR == 1 { capacity = $0 } NR == 2 { printf "Battery %s%% · %s", capacity, $0 }' /sys/class/power_supply/BAT0/capacity /sys/class/power_supply/BAT0/status
    color = $text
    font_size = 12
    font_family = $font
    position = 0, 32
    halign = center
    valign = bottom
    zindex = 1
}
