# Edit this file and relaunch scripts/preview-sddm.sh; no rebuild is needed to preview.
[General]

# Panel layout and glass
FormPosition=left
FormWidth=440
FormHeight=600
FormMargin=48
FormPadding=24
FormSpacing=12
FormOpacity=0.9
RoundCorners=16
InputWidthRatio=0.88
InputOpacity=1.0
PartialBlur=true
Blur=0.8
BlurMax=32
DimBackground=0.0
AnimationDuration=180

# Typography and clock
Font=JetBrainsMono Nerd Font
FontSize=10
TimeFontSize=48
DateFontSize=12
ClockSpacing=8
Locale=
HourFormat=HH:mm
DateFormat=ddd MMM dd yyyy
HeaderText=

# Wallpaper and preview window (SDDM sizes the real greeter to its screen)
# This source path is relative to the theme folder; Nix overrides only Background
# with a packaged copy of stylix.image for the real login screen.
Background=../../../assets/wallpapers/sanguinius-woodblock-restored.png
CropBackground=true
ScreenWidth=1920
ScreenHeight=1080

# Rosé Pine palette, matching the shell
HeaderTextColor=#e0def4
DateTextColor=#908caa
TimeTextColor=#e0def4
FormBackgroundColor=#13111b
BackgroundColor=#13111b
DimBackgroundColor=#13111b
LoginFieldBackgroundColor=#1f1d2e
PasswordFieldBackgroundColor=#1f1d2e
LoginFieldTextColor=#e0def4
PasswordFieldTextColor=#e0def4
UserIconColor=#c4a7e7
PasswordIconColor=#c4a7e7
PlaceholderTextColor=#908caa
WarningColor=#eb6f92
LoginButtonTextColor=#13111b
LoginButtonBackgroundColor=#ebbcba
SystemButtonsIconsColor=#908caa
SessionButtonTextColor=#908caa
VirtualKeyboardButtonTextColor=#908caa
DropdownTextColor=#e0def4
DropdownSelectedBackgroundColor=#403d52
DropdownBackgroundColor=#26233a
HighlightTextColor=#13111b
HighlightBackgroundColor=#ebbcba
HighlightBorderColor=#c4a7e7
HoverUserIconColor=#e0def4
HoverPasswordIconColor=#e0def4
HoverSystemButtonsIconsColor=#ebbcba
HoverSessionButtonTextColor=#ebbcba
HoverVirtualKeyboardButtonTextColor=#ebbcba

# Login and keyboard behavior
KeyboardSize=0.4
VirtualKeyboardPosition=left
HideVirtualKeyboard=false
HideSystemButtons=false
HideLoginButton=false
UseRealName=true
ForceLastUser=true
PasswordFocus=true
HideCompletePassword=true
AllowEmptyPassword=false
BypassSystemButtonsChecks=false
RightToLeftLayout=false

# Optional label overrides (blank uses SDDM translations)
TranslatePlaceholderUsername=
TranslatePlaceholderPassword=
TranslateLogin=
TranslateLoginFailedWarning=
TranslateCapslockWarning=
TranslateSuspend=
TranslateHibernate=
TranslateReboot=
TranslateShutdown=
TranslateSessionSelection=
TranslateVirtualKeyboardButtonOn=
TranslateVirtualKeyboardButtonOff=
